<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>anifrz</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <main class="app">
      <header class="topbar">
        <div class="brand">
          <h1>anifrz</h1>
          <p>本地番剧媒体库</p>
        </div>
        <div class="actions">
          <input id="rootPath" placeholder="输入媒体目录，例如 /data/anime" />
          <button id="startBtn">开始刮削</button>
          <button id="reloadBtn">刷新作品墙</button>
        </div>
      </header>

      <section class="layout">
        <section class="panel wall">
          <div class="panel-head">
            <h2>作品墙</h2>
            <div id="wallCount" class="meta"></div>
          </div>
          <div id="wallGrid" class="wall-grid"></div>
        </section>

        <section class="panel detail">
          <div id="detailPane" class="detail-pane empty">请选择一个作品查看详情</div>
        </section>
      </section>

      <section class="panel log-panel">
        <div class="panel-head">
          <h2>日志</h2>
          <div id="logState" class="meta"></div>
        </div>
        <pre id="logView"></pre>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
